[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "liminalkeys-sign"
version = "0.1.10"
description = "PAdES PDF signing helper for Liminal Keys AI agents (hash-only, pyHanko)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Liminal Keys" }]
keywords = ["liminal-keys", "pades", "pdf", "pyhanko", "signing"]
dependencies = [
    "asn1crypto>=1.5.0",
    "cryptography>=42.0.0",
    "pyhanko>=0.25.0",
]

[project.optional-dependencies]
dev = ["pillow>=10.0.0", "pytest>=8.0.0"]
image = ["pillow>=10.0.0"]

[project.scripts]
liminalkeys-sign = "liminalkeys_sign.cli:main"
liminal-sign = "liminalkeys_sign.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["liminalkeys_sign*"]

[tool.setuptools.package-data]
liminalkeys_sign = ["data/*.json"]