name: Liminal self-hosted bootstrap
description: macOS PATH helpers and Python >= 3.10 resolver for org self-hosted runners.
runs:
  using: composite
  steps:
    - name: Isolate Azure CLI config (per-run)
      shell: bash
      run: echo "AZURE_CONFIG_DIR=${RUNNER_TEMP}/azure-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "$GITHUB_ENV"

    - name: Add local tool paths (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
        echo "/usr/local/bin" >> "$GITHUB_PATH"
        echo "$HOME/bin" >> "$GITHUB_PATH"
        echo "$HOME/.dotnet" >> "$GITHUB_PATH"

    - name: Add local tool paths (Windows, Git Bash)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "C:\\Program Files\\Microsoft SDKs\\Azure\\CLI2\\wbin" >> "$GITHUB_PATH"
        echo "C:\\Program Files\\GitHub CLI" >> "$GITHUB_PATH"
        echo "C:\\Program Files\\dotnet" >> "$GITHUB_PATH"
        echo "C:\\Program Files\\nodejs" >> "$GITHUB_PATH"
        echo "C:\\Program Files\\Git\\usr\\bin" >> "$GITHUB_PATH"
        echo "C:\\Program Files\\Git\\bin" >> "$GITHUB_PATH"
        echo "/c/Program Files/Microsoft SDKs/Azure/CLI2/wbin" >> "$GITHUB_PATH"

    - name: Writable .NET install dir (Windows setup-dotnet)
      if: runner.os == 'Windows'
      shell: bash
      run: echo "DOTNET_INSTALL_DIR=${RUNNER_TEMP}/dotnet" >> "$GITHUB_ENV"

    - name: Resolve Python executable
      shell: bash
      run: |
        PY=""
        py_try() {
          local p="$1"
          shift
          [ -n "$p" ] || return 1
          [ -x "$p" ] || command -v "$p" >/dev/null 2>&1 || return 1
          case "$p" in *WindowsApps*) return 1 ;; esac
          if "$p" "$@" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)' 2>/dev/null; then
            if [ "$#" -gt 0 ]; then
              PY="$("$p" "$@" -c 'import sys; print(sys.executable)' | tr -d '\r')"
            elif [ -x "$p" ]; then
              PY="$(printf '%s' "$p" | tr -d '\r')"
            else
              PY="$(command -v "$p" | tr -d '\r')"
            fi
            return 0
          fi
          return 1
        }
        candidates=(
          python3.12 python3.13 python3.11 python3.10 python3
          /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.11 /opt/homebrew/bin/python3.10 /opt/homebrew/bin/python3
          /usr/local/bin/python3.12 /usr/local/bin/python3.13 /usr/local/bin/python3.11 /usr/local/bin/python3.10 /usr/local/bin/python3
        )
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          candidates+=( python )
          if [ -n "${LOCALAPPDATA:-}" ]; then
            for minor in 312 313; do
              win_py="${LOCALAPPDATA}/Programs/Python/Python${minor}/python.exe"
              win_py="$(printf '%s' "$win_py" | sed 's|\\|/|g')"
              candidates+=( "$win_py" )
            done
          fi
        else
          candidates+=( python )
        fi
        for cand in "${candidates[@]}"; do
          py_try "$cand" && break
        done
        if [ -z "$PY" ]; then
          set -- py -3
          p="$(command -v "$1" 2>/dev/null || true)"
          if [ -n "$p" ]; then
            py_try "$p" "${@:2}"
          fi
        fi
        if [ -z "$PY" ]; then
          echo "::error::No Python >= 3.10 found on this runner (Microsoft Store stubs are ignored)."
          exit 1
        fi
        echo "Using Python: $PY ($("$PY" --version 2>&1))"
        PY="$(printf '%s' "$PY" | tr -d '\r')"
        echo "PY=$PY" >> "$GITHUB_ENV"