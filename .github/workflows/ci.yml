name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  runner-policy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/liminal-self-hosted-bootstrap
      - name: Check workflow runs-on labels
        run: |
          set -euo pipefail
          "${PY}" scripts/ci/check_runner_policy.py

  liminalkeys-sign:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/liminal-self-hosted-bootstrap

      - name: Set up venv and install tooling
        run: |
          set -euo pipefail
          "${PY}" -m venv "${RUNNER_TEMP}/lk-ci-venv"
          # shellcheck disable=SC1091
          if [ "${RUNNER_OS}" = "Windows" ]; then
            source "${RUNNER_TEMP}/lk-ci-venv/Scripts/activate"
          else
            source "${RUNNER_TEMP}/lk-ci-venv/bin/activate"
          fi
          python -m pip install -U pip
          python -m pip install build pytest
          echo "LK_CI_VENV=${RUNNER_TEMP}/lk-ci-venv" >> "$GITHUB_ENV"

      - name: Install package (dev)
        working-directory: packages/liminalkeys-sign
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            source "${LK_CI_VENV}/Scripts/activate"
          else
            source "${LK_CI_VENV}/bin/activate"
          fi
          python -m pip install -e ".[dev]"

      - name: Test
        working-directory: packages/liminalkeys-sign
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            source "${LK_CI_VENV}/Scripts/activate"
          else
            source "${LK_CI_VENV}/bin/activate"
          fi
          python -m pytest -q

      - name: Bundled wheel matches source
        working-directory: packages/liminalkeys-sign
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            source "${LK_CI_VENV}/Scripts/activate"
          else
            source "${LK_CI_VENV}/bin/activate"
          fi
          python scripts/check_bundled_wheel.py

      - name: Offline liminal-sign wrapper (sandbox-style)
        env:
          LIMINALKEYS_SIGN_CACHE: "${{ runner.temp }}/lk-ci-cache"
        run: |
          set -euo pipefail
          chmod +x skills/liminalkeys-sign/bin/liminal-sign
          skills/liminalkeys-sign/bin/liminal-sign --version | grep -F '0.1.13'